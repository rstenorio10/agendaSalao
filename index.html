<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espaço Geisch Araújo | Agendamento</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <main class="main-container">
        <!-- Seção da Esquerda: Marca e Imagem -->
        <section class="branding-section">
            <h1 class="brand-title">Espaço Geisch Araújo</h1>
            <p class="brand-subtitle">Realçando sua beleza natural</p>
            <div class="image-wrapper">
                <img src="./img/img-principal.jfif" alt="Ilustração Espaço Geisch Araújo" class="hero-image">
            </div>
        </section>

        <!-- Seção da Direita: Agenda e Pix -->
        <section class="card">
            <h2>✨ Agende seu Horário ✨</h2>
            
            <div class="input-group">
                <input type="text" id="nome" placeholder="Seu nome completo">
                
                <!-- Serviços com Duração Oculta em Minutos (data-tempo) -->
                <select id="servico" onchange="atualizarHorariosDisponiveis()">
                    <option value="" disabled selected>Selecione o serviço</option>
                    <option value="Alisamento" data-tempo="90">Alisamento</option>
                    <option value="Cílios fio a fio" data-tempo="60">Cílios fio a fio</option>
                    <option value="Colocação de cabelo" data-tempo="120">Colocação de cabelo</option>
                    <option value="Escova / Prancha" data-tempo="60">Escova / Prancha</option>
                    <option value="Manicure" data-tempo="40">Manicure</option>
                    <option value="Manicure / Pedicure" data-tempo="90">Manicure / Pedicure</option>
                    <option value="Pedicure" data-tempo="40">Pedicure</option>
                    <option value="Progressiva" data-tempo="60">Progressiva</option>
                    <option value="Sobrancelha" data-tempo="20">Sobrancelha</option>
                    <option value="Sobrancelha / Henna" data-tempo="20">Sobrancelha / Henna</option>
                    <option value="Unha de gel" data-tempo="120">Unha de gel</option>
                </select>

                <input type="date" id="data" onchange="atualizarHorariosDisponiveis()">
                
                <!-- Seletor Dinâmico de Horários -->
                <select id="hora">
                    <option value="" disabled selected>Selecione o serviço e a data primeiro</option>
                </select>

                <!-- Área Pix (Apenas Chave + Copiar) -->
                <div class="pix-card">
                    <div class="pix-header">
                        <p>💳 <strong>Taxa de Reserva: R$ 30,00</strong></p>
                        <small>Garante a sua vaga e é abatido do valor do serviço.</small>
                    </div>

                    <div class="pix-body">
                        <div class="pix-copia">
                            <label>Chave Pix (CPF):</label>
                            <div class="copia-box">
                                <input type="text" id="chave-pix" value="34385500835" readonly>
                                <button type="button" onclick="copiarPix()">Copiar</button>
                            </div>
                        </div>
                    </div>

                    <p class="aviso-ressarcimento">⚠️ <em>Caso não compareça na data e horário marcados, o valor do sinal não será ressarcido.</em></p>
                </div>

                <button onclick="agendar()">Confirmar Agendamento via WhatsApp</button>
                <button id="btn-verificar" class="btn-secundario" onclick="toggleAgenda()">🔒 Área Administrativa</button>
            </div>

            <!-- Seção Restrita (Painel de Gerenciamento) -->
            <div class="agendamento oculto" id="secao-agenda">
                <h3>🔒 Painel de Controle - Horários Reservados</h3>
                <ul id="lista-agendamento"></ul>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
